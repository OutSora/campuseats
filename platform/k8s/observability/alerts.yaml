apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: campuseats-alerts
  namespace: observability
  labels: {release: kube-prometheus-stack}
spec:
  groups:
    - name: campuseats.rules
      rules:
        - alert: CampusEatsHighP95Latency
          expr: histogram_quantile(0.95, sum by (le) (rate(istio_request_duration_milliseconds_bucket{destination_workload_namespace="campuseats"}[5m]))) > 1000
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: CampusEats p95 latency is above one second
        - alert: KafkaConsumerLagHigh
          expr: max(kafka_consumergroup_lag) > 100
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Kafka consumer lag is above 100 messages
        - alert: RateLimiterRejectingTraffic
          expr: sum(rate(envoy_http_ratelimit_over_limit[5m])) > 0
          for: 1m
          labels: {severity: info}
          annotations:
            summary: Rate limiter is rejecting requests as designed

